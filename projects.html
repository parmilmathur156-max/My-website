<!DOCTYPE html>
<html>
<head>
  <title>My Projects - Locked</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b0b16;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      background: #151525;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      width: 300px;
    }

    h1 {
      color: #00c6ff;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 12px 30px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6a5acd, #00bfff);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #error {
      color: #ff5c5c;
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🔒 Projects</h1>
    <p>Enter password to continue</p>

    <input type="password" id="password" placeholder="Enter password">

    <br>

    <button onclick="unlock()">Unlock</button>

    <p id="error">❌ Incorrect password</p>
  </div>

  <script>
    function unlock() {
      const password = document.getElementById("password").value;

      if (password === "12345") {
        window.location.href = "projects-main.html";
      } else {
        document.getElementById("error").style.display = "block";
      }
    }
  </script>

</body>
</html>
