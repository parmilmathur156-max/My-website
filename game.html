<!DOCTYPE html>
<html>
<head>
  <title>Battle Arena</title>

  <style>
    body {
      margin: 0;
      background: #080812;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      color: #00eaff;
      margin: 12px;
    }

    .info {
      font-size: 17px;
      margin: 10px;
    }

    #game {
      width: 92vw;
      height: 65vh;
      max-width: 1000px;
      margin: auto;
      background: #151525;
      border: 2px solid #00eaff;
      border-radius: 15px;
      position: relative;
      overflow: hidden;
    }

    #player {
      width: 35px;
      height: 35px;
      background: #00eaff;
      border-radius: 50%;
      position: absolute;
      left: 50%;
      top: 50%;
    }

    .controls {
      margin-top: 15px;
    }

    .controls button {
      width: 65px;
      height: 55px;
      margin: 4px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6a5acd, #00bfff);
      color: white;
      font-size: 22px;
      font-weight: bold;
      touch-action: manipulation;
    }

    .row {
      display: flex;
      justify-content: center;
    }
  </style>
</head>

<body>

  <h1>⚔️ BATTLE ARENA</h1>

  <div class="info">
    ❤️ Health: 100 &nbsp; | &nbsp; 🏆 Score: 0
  </div>

  <div id="game">
    <div id="player"></div>
  </div>

  <div class="controls">

    <div>
      <button onclick="move(0,-3)">⬆️</button>
    </div>

    <div class="row">
      <button onclick="move(-3,0)">⬅️</button>
      <button onclick="move(0,3)">⬇️</button>
      <button onclick="move(3,0)">➡️</button>
    </div>

  </div>

  <script>
    const player = document.getElementById("player");

    let x = 50;
    let y = 50;

    function move(dx, dy) {
      x += dx;
      y += dy;

      x = Math.max(0, Math.min(95, x));
      y = Math.max(0, Math.min(90, y));

      player.style.left = x + "%";
      player.style.top = y + "%";
    }

    document.addEventListener("keydown", function(event) {

      if (event.key === "ArrowUp" || event.key === "w")
        move(0, -3);

      if (event.key === "ArrowDown" || event.key === "s")
        move(0, 3);

      if (event.key === "ArrowLeft" || event.key === "a")
        move(-3, 0);

      if (event.key === "ArrowRight" || event.key === "d")
        move(3, 0);
    });
  </script>

</body>
</html>
